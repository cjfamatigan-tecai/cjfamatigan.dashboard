<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set new password — Aurora Retail</title>
<meta name="description" content="Set a new password for your Aurora Retail account.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="aurora__blob aurora__blob--1"></div>
  <div class="aurora__blob aurora__blob--2"></div>
  <div class="aurora__blob aurora__blob--3"></div>
</div>

<main class="auth-shell">
  <div class="auth-card">
    <div class="brand-mark">
      <div class="brand-mark__logo">AR</div>
      <div>
        <div class="brand-mark__name">Aurora Retail</div>
        <div class="brand-mark__tagline">Account recovery</div>
      </div>
    </div>

    <h1>Set a new password</h1>
    <p class="subtitle">You've verified this is your account. Choose a new password below.</p>

    <div id="reset-alert"></div>

    <form id="reset-form" novalidate>
      <div class="field">
        <label for="reset-password">New password</label>
        <input id="reset-password" name="password" type="password" autocomplete="new-password" required placeholder="At least 8 characters">
        <button type="button" class="password-toggle" data-target="reset-password">Show</button>
      </div>

      <div class="field">
        <label for="reset-confirm">Confirm new password</label>
        <input id="reset-confirm" name="confirm" type="password" autocomplete="new-password" required placeholder="Re-enter your new password">
        <button type="button" class="password-toggle" data-target="reset-confirm">Show</button>
      </div>

      <button id="reset-submit" class="btn btn-primary" type="submit">Update password</button>
    </form>

    <p class="auth-footer">
      <a class="link" href="index.html">Back to sign in</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
