<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password — Aurora Retail</title>
<meta name="description" content="Recover access to your Aurora Retail account.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="aurora__blob aurora__blob--1"></div>
  <div class="aurora__blob aurora__blob--2"></div>
  <div class="aurora__blob aurora__blob--3"></div>
</div>

<main class="auth-shell">
  <div class="auth-card">
    <div class="brand-mark">
      <div class="brand-mark__logo">AR</div>
      <div>
        <div class="brand-mark__name">Aurora Retail</div>
        <div class="brand-mark__tagline">Account recovery</div>
      </div>
    </div>

    <h1>Can't sign in?</h1>
    <p class="subtitle">
      Enter the email address on your account and we'll send a link to reset your
      password and verify it's really you.
    </p>

    <div id="forgot-alert"></div>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="forgot-email">Email address</label>
        <input id="forgot-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>

      <button id="forgot-submit" class="btn btn-primary" type="submit">Send reset link</button>
    </form>

    <p class="auth-footer">
      Remembered it after all? <a class="link" href="index.html">Back to sign in</a>
    </p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
